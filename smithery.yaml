# Smithery configuration: runs the published npm package over stdio
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - privateKey
    properties:
      privateKey:
        type: string
        description: Private key of a small dedicated wallet holding a few dollars of USDC on Base. Pays each page.
      budget:
        type: string
        default: "2"
        description: Max USD spent per session.
      maxPerCall:
        type: string
        default: "0.05"
        description: Max USD for any single page.
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', 'geo402-mcp'],
      env: {
        GEO402_PRIVATE_KEY: config.privateKey,
        GEO402_BUDGET: config.budget || '2',
        GEO402_MAX_PER_CALL: config.maxPerCall || '0.05'
      }
    })
